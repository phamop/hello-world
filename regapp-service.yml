### Fix CRLF across the role

Since your `grep -RIl $'\r'` output shows CRLF almost everywhere, convert the role in one shot:

```bash
find roles/lablabs.rke2 \
  -type f \
  \( -name "*.yml" -o -name "*.yaml" -o -name "*.j2" -o -name "*.sh" -o -name "*.md" -o -name "*.rst" \) \
  -exec sed -i 's/\r$//' {} +
```

Then verify:

```bash
grep -RIl $'\r' roles/lablabs.rke2
```

It should return **nothing**.

Then check `rke2.yml`:

```bash
grep -n "rke2.sh" roles/lablabs.rke2/tasks/rke2.yml | cat -A
```

You want:

```text
cmd: "{{ rke2_install_script_dir }}/rke2.sh"$
```

not:

```text
cmd: "{{ rke2_install_script_dir }}/rke2.sh"^M$
```

### Check the actual script directory variable through the playbook

Because the variable belongs to the role, the cleanest way to see its value is temporarily add a debug immediately before the failing task in:

```text
roles/lablabs.rke2/tasks/rke2.yml
```

Just before:

```yaml
- name: Run RKE2 install script with airgap variables
```

add:

```yaml
- name: Debug RKE2 install script path
  ansible.builtin.debug:
    msg:
      - "DIR=[{{ rke2_install_script_dir }}]"
      - "SCRIPT=[{{ rke2_install_script_dir }}/rke2.sh]"
```

Then rerun your playbook with:

```bash
ansible-playbook \
  -i inventory/dev/hosts.ini \
  <your-playbook>.yml \
  --limit master01
```

You should see:

```text
DIR=[/var/tmp]
SCRIPT=[/var/tmp/rke2.sh]
```

If instead you see:

```text
DIR=[/var/tmp                              ]
```

then the variable itself has trailing spaces.

