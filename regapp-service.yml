### One thing I would change in the task itself

Once you clean the source files, make the execution task defensive.

If you currently have:

```yaml
- name: Run RKE2 install script with airgap variables
  ansible.builtin.command:
    cmd: "{{ rke2_install_script_dir }}/rke2.sh"
```

change it to:

```yaml
- name: Run RKE2 install script with airgap variables
  ansible.builtin.command:
    cmd: "{{ rke2_install_script_dir | trim }}/rke2.sh"
```

That protects you against accidental whitespace in the directory variable.

Even better, define a normalized variable:

```yaml
rke2_install_script_dir: "/var/tmp"
```

and ensure there's no whitespace embedded in the YAML value.

